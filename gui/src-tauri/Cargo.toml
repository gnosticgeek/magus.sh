[package]
name = "magus-gui"
version = "0.1.0"
description = "The magus desktop app"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt"] }
thiserror = "2"
dirs = "5"
which = "7"

[features]
# Used by the Tauri CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]
