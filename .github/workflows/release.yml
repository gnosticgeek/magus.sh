name: release

# Cutting a tag publishes the binaries that magus.sh/install downloads.
# Nothing else produces them, so the installer is only as current as the last
# tag pushed here.
on:
  push:
    tags: ['v*']
  # Allows a dry build from the Actions tab without publishing anything.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: magus/go.mod
          cache-dependency-path: magus/go.sum

      - name: Test
        working-directory: magus
        run: go test ./...

      - name: Vet
        working-directory: magus
        run: go vet ./...

      - name: Build
        working-directory: magus
        env:
          CGO_ENABLED: '0' # static, so it runs on any glibc SteamOS ships
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build \
                -trimpath \
                -ldflags "-s -w -X main.buildVersion=${version}" \
                -o "dist/magus-${os}-${arch}" .
            done
          done
          cd dist && sha256sum magus-linux-* magus-darwin-* > checksums.txt
          cat checksums.txt

      - name: Smoke-test the amd64 binary
        working-directory: magus/dist
        run: |
          chmod +x magus-linux-amd64
          ./magus-linux-amd64 version
          # `doctor` with no manifest exits 1 by design; assert that rather than
          # letting a non-zero exit fail the job.
          ./magus-linux-amd64 doctor --plain && code=0 || code=$?
          test "$code" = "1" || { echo "doctor exited $code, expected 1"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: magus-binaries
          path: magus/dist/*

  mac-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: magus/go.mod
          cache-dependency-path: magus/go.sum
      - name: Test Mac behavior with isolated fixtures
        working-directory: magus
        run: |
          go test ./...
          go vet ./...
          MAGUS_TEST_MAC_DEFAULTS=1 go test -run TestMacRealPreferenceFile -v
          go build -o /tmp/magus .
          /tmp/magus version

  publish:
    needs: [build, mac-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The curated notes live in the tagged source tree rather than being
      # reconstructed from commits after the binaries have been built.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: magus-binaries
          path: magus/dist
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            magus/dist/magus-linux-amd64 \
            magus/dist/magus-linux-arm64 \
            magus/dist/magus-darwin-amd64 \
            magus/dist/magus-darwin-arm64 \
            magus/dist/checksums.txt
